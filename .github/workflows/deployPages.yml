name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "26"
          cache: npm
          cache-dependency-path: fantasyAnimeLeague/package-lock.json

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Install FAL dependencies
        working-directory: fantasyAnimeLeague
        run: npm ci

      - name: Check FAL code
        working-directory: fantasyAnimeLeague
        run: npm run lint

      - name: Build FAL
        working-directory: fantasyAnimeLeague
        run: npm run build

      - name: Assemble published site
        run: |
          mkdir -p "$RUNNER_TEMP/pages/fantasyAnimeLeague"
          cp -R PSU "$RUNNER_TEMP/pages/PSU"
          cp -R fantasyAnimeLeague/app/frontend/react/dist/. "$RUNNER_TEMP/pages/fantasyAnimeLeague/"

      - name: Upload published site
        uses: actions/upload-pages-artifact@v4
        with:
          path: ${{ runner.temp }}/pages

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
