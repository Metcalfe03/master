<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>DEF CON - Product</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css"
      rel="stylesheet"
    />
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>

    <link href="/css/styles.css" rel="stylesheet" />
  </head>

  <body class="bg-dark text-light">
    
    
    <!-- header with navbar -->
     <header>
      <nav class="navbar navbar-expand-lg navbar-dark bg-black border-bottom border-success">
        <div class="container">
          <a class="navbar-brand fw-bold text-success" href="/index.html">
            DEFCON<span class="text-light"> 34</span>
          </a>

          <button
            class="navbar-toggler"
            type="button"
            data-bs-toggle="collapse"
            data-bs-target="#defconNavbar"
            aria-controls="defconNavbar"
            aria-expanded="false"
            aria-label="Toggle navigation"
          >
            <span class="navbar-toggler-icon"></span>
          </button>

          <div class="collapse navbar-collapse" id="defconNavbar">
            <ul class="navbar-nav me-auto mb-2 mb-lg-0">
              <li class="nav-item">
                <a class="nav-link" href="/index.html"
                  >Home</a
                >
              </li>
              <li class="nav-item">
                <a class="nav-link" href="#">Schedule</a>
              </li>
              <li class="nav-item">
                <a class="nav-link" href="/panels/index.html">Panels</a>
              </li>
              <li class="nav-item">
                <a class="nav-link active text-success" href="/merch/index.html">Merch</a>
              </li>
            </ul>

          <!-- register & cart -->
          <div class="d-flex align-items-center gap-2">
            <a href="/signup/index.html" class="btn btn-success">Register</a>
            <button
              id="cartButton"
              class="btn btn-outline-success position-relative"
            >
              <i class="bi bi-cart4"></i> Cart
              <span
                id="cartCount"
                class="position-absolute top-0 start-100 translate-middle badge rounded-pill bg-danger"
                >0</span
              >
            </button>
          </div>
        </div>
      </nav>
    </header>

    <!-- product -->
    <section class="py-5">
      <div class="container">
        <div class="row" id="productContainer">
        </div>
      </div>
    </section>

    <!-- cart modal -->
    <div
      class="modal fade"
      id="cartModal"
      tabindex="-1"
      aria-labelledby="cartModalLabel"
      aria-hidden="true"
    >
      <div class="modal-dialog">
        <div class="modal-content bg-dark text-light border-success">
          <div class="modal-header">
            <h5 class="modal-title text-success" id="cartModalLabel">
              Your Cart
            </h5>
            <button
              type="button"
              class="btn-close btn-close-white"
              data-bs-dismiss="modal"
              aria-label="Close"
            ></button>
          </div>
          <div class="modal-body" id="cartModalBody">
            <!-- Cart items loaded dynamically -->
          </div>
          <div class="modal-footer">
            <a href="/checkout/index.html" class="btn btn-success w-100"
              >Proceed to Checkout</a
            >
          </div>
        </div>
      </div>
    </div>

    <!-- toast -->
    <div class="position-fixed bottom-0 end-0 p-3" style="z-index: 1080">
      <div
        id="cartToast"
        class="toast align-items-center text-white bg-success border-0"
        role="alert"
        aria-live="assertive"
        aria-atomic="true"
      >
        <div class="d-flex">
          <div class="toast-body">Item added to cart!</div>
          <button
            type="button"
            class="btn-close btn-close-white me-2 m-auto"
            data-bs-dismiss="toast"
            aria-label="Close"
          ></button>
        </div>
      </div>
    </div>

    <!-- footer -->
    <footer class="bg-black text-light py-4 border-top border-success">
      <div class="container d-flex justify-content-between align-items-center">
        <p class="mb-0">&copy; 2026 DEF CON. All rights reserved.</p>
        <div>
          <a
            href="https://x.com/defcon"
            class="text-success me-3"
            target="_blank"
            >Twitter</a
          >
          <a
            href="https://www.linkedin.com/company/def-con"
            class="text-success me-3"
            target="_blank"
            >LinkedIn</a
          >
          <a
            href="https://www.instagram.com/wearedefcon/"
            class="text-success"
            target="_blank"
            >Instagram</a
          >
        </div>
      </div>
    </footer>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/js/merchandise.js"></script>
  </body>
</html>
