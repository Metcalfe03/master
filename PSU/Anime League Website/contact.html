<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Contact - Fantasy Anime League</title>
  <link rel="stylesheet" href="style.css">
  <link href="https://fonts.googleapis.com/css2?family=Yusei+Magic&display=swap" rel="stylesheet">
</head>
<body>
  <div class="container">
    <h1>Contact</h1>
    <nav>
      <a href="main.html">Home</a> |
      <a href="description.html">Project Details</a> |
      <a href="contact.html">Contact</a>
    </nav>

    <div class="section contact-info">
      <h2>Get in touch</h2>
      <p>Name: Matt Metcalfe</p>
      <p>Email: business@email.com</p>
      <p>Social: Twitter, Discord, etc.</p>
    </div>

    <div class="section suggestions">
      <h2>Suggestions</h2>
      <form>
        <label for="email">Your Email (optional):</label><br>
        <input type="email" id="email" name="email" placeholder="your@email.com"><br><br>

        <label for="feedback">If you have any suggestions, please let me know!</label><br>
        <textarea id="feedback" name="feedback" rows="5" cols="40" placeholder="Type here..."></textarea><br>
        
        <button type="submit">Submit</button>
      </form>
    </div>
  </div>
</body>
</html>
